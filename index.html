<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOM Live Clock</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

body{
  font-family:Arial, Helvetica, sans-serif;
}

.overlay{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
}

/* Main broadcast bar */
.bar{
  position:relative;
  display:flex;
  align-items:center;
  height:118px;
  padding:8px 10px 8px 14px;

  /* Semi-transparent black background */
  background:rgba(8,8,8,.78);

  border:2px solid rgba(255,255,255,.10);
  border-radius:22px;

  box-shadow:
    0 8px 28px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.08);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

/* Date section */
.dateBox{
  height:92px;
  min-width:470px;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:22px;
  color:white;
}

.day{
  display:flex;
  align-items:center;
  justify-content:center;

  height:64px;
  padding:0 18px;

  background:linear-gradient(
    180deg,
    #f53333 0%,
    #d71919 100%
  );

  border-radius:10px;

  font-size:42px;
  font-weight:900;
  letter-spacing:1px;

  text-shadow:0 2px 3px rgba(0,0,0,.45);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 4px 10px rgba(0,0,0,.3);
}

.dateDivider{
  width:2px;
  height:58px;
  background:rgba(255,255,255,.55);
}

.dateText{
  display:flex;
  align-items:center;
  gap:14px;

  font-size:39px;
  font-weight:900;
  letter-spacing:1px;
  white-space:nowrap;

  text-shadow:0 2px 4px rgba(0,0,0,.8);
}

.dateText .number{
  color:#ffffff;
}

.dateText .month{
  color:#ffd84a;
}

.dateText .year{
  color:#ffffff;
}

/* Large time section */
.timeBox{
  height:104px;
  min-width:680px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 30px;

  background:
    linear-gradient(
      180deg,
      rgba(30,30,30,.95),
      rgba(8,8,8,.96)
    );

  border:4px solid #ef2929;
  border-radius:34px;

  box-shadow:
    0 0 0 2px rgba(255,255,255,.05),
    0 5px 18px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.12);

  margin-left:0;
  z-index:2;
}

.time{
  color:#ffffff;

  font-size:72px;
  line-height:1;

  font-weight:900;
  letter-spacing:3px;

  text-shadow:
    0 3px 5px rgba(0,0,0,.75);
}

.ampm{
  margin-left:20px;

  color:#ff3030;

  font-size:52px;
  font-weight:900;

  letter-spacing:1px;

  text-shadow:
    0 2px 5px rgba(0,0,0,.7);
}

/* VOM badge */
.vom{
  height:82px;
  min-width:190px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-left:12px;
  padding:0 26px;

  color:#ffffff;

  font-size:43px;
  font-weight:900;
  letter-spacing:2px;

  background:
    linear-gradient(
      180deg,
      #f12b2b 0%,
      #bd1010 100%
    );

  border:2px solid rgba(255,255,255,.18);
  border-radius:18px;

  text-shadow:
    0 2px 4px rgba(0,0,0,.65);

  box-shadow:
    0 5px 15px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.25);
}

/* Smaller screens */
@media(max-width:1100px){
  .bar{
    height:92px;
    border-radius:17px;
  }

  .dateBox{
    min-width:auto;
    height:76px;
    padding:0 12px;
    gap:12px;
  }

  .day{
    height:50px;
    font-size:28px;
    padding:0 12px;
  }

  .dateDivider{
    height:42px;
  }

  .dateText{
    font-size:25px;
    gap:8px;
  }

  .timeBox{
    min-width:450px;
    height:80px;
    border-width:3px;
    border-radius:25px;
    padding:0 20px;
  }

  .time{
    font-size:48px;
  }

  .ampm{
    font-size:34px;
    margin-left:12px;
  }

  .vom{
    min-width:125px;
    height:62px;
    font-size:29px;
    border-radius:13px;
  }
}
</style>
</head>

<body>

<div class="overlay">

  <div class="bar">

    <!-- DATE -->
    <div class="dateBox">

      <div class="day" id="day">WED</div>

      <div class="dateDivider"></div>

      <div class="dateText">
        <span class="number" id="date">30</span>
        <span class="month" id="month">SEP</span>
        <span class="year" id="year">2026</span>
      </div>

    </div>

    <!-- TIME -->
    <div class="timeBox">

      <span class="time" id="time">08:30:25</span>

      <span class="ampm" id="ampm">PM</span>

    </div>

    <!-- VOM -->
    <div class="vom">
      VOM
    </div>

  </div>

</div>

<script>
function updateClock(){

  const now = new Date();

  /*
    Bangladesh Standard Time
    UTC + 6
  */

  const dateParts = new Intl.DateTimeFormat("en-US",{
    timeZone:"Asia/Dhaka",
    weekday:"short",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).formatToParts(now);

  function getPart(type){
    const item = dateParts.find(p => p.type === type);
    return item ? item.value : "";
  }

  document.getElementById("day").textContent =
    getPart("weekday").toUpperCase();

  document.getElementById("date").textContent =
    getPart("day");

  document.getElementById("month").textContent =
    getPart("month").toUpperCase();

  document.getElementById("year").textContent =
    getPart("year");


  const timeParts = new Intl.DateTimeFormat("en-US",{
    timeZone:"Asia/Dhaka",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:true
  }).formatToParts(now);

  function getTimePart(type){
    const item = timeParts.find(p => p.type === type);
    return item ? item.value : "";
  }

  document.getElementById("time").textContent =
    getTimePart("hour") + ":" +
    getTimePart("minute") + ":" +
    getTimePart("second");

  document.getElementById("ampm").textContent =
    getTimePart("dayPeriod").toUpperCase();
}

updateClock();

/* Update every second */
setInterval(updateClock,1000);
</script>

</body>
</html>
